# Nixpacks configuration for Coolify deployment
[phases.setup]
nixPkgs = ["nodejs_22", "curl", "wget"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
